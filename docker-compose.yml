version: '3.8'

services:
  # Backend API (Go + Gin)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmall_dd-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:?}
      - DB_NAME=postgres
      - PORT=8081
      - JWT_SECRET=${JWT_SECRET:?}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-a@naver.com}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cmall_dd-network

  # Frontend (Vite + React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Reown Cloud projectId — https://cloud.reown.com 에서 발급
        VITE_WALLETCONNECT_PROJECT_ID: "8a3a67494262903e5846f52ab4f445b8"
    container_name: cmall_dd-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cmall_dd-network

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cmall_dd-postgres
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cmall_dd-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cmall_dd-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - cmall_dd-network

  # CI test services (docker compose run --rm --build, Jenkins 컨테이너에 Go/Node 없음)
  # 볼륨 대신 build 컨텍스트: docker-in-docker에선 Jenkins 컨테이너 CLI가 컨텍스트
  # tar를 호스트 daemon으로 스트리밍 → daemon이 /var/jenkins_home/... 경로를
  # 해석하지 않음 (build #3 빈 마운트 실패의 원인 회피)
  # test-go: golang + server 컨텍스트 (go vet/test; cgo 불필요 실측)
  test-go:
    build:
      context: ./server
      dockerfile: Dockerfile.ci
    networks:
      - cmall_dd-network

  # test-front: node + 레포 컨텍스트 (npm ci + tsc 리포트 + vite build 게이트)
  test-front:
    build:
      context: .
      dockerfile: Dockerfile.frontend.ci
    networks:
      - cmall_dd-network

networks:
  cmall_dd-network:
    driver: bridge

volumes:
  postgres_data: