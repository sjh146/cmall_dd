server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API 프록시 — backend 컨테이너(8081)로 전달 (JSON 응답, SPA fallback 방지)
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files with caching (해시된 자산은 1년 immutable — 새 빌드 = 새 해시 = 새 URL)
    location / {
        try_files $uri $uri/ /index.html;
        # index.html/HTML은 항상 재검증 — 브라우저 캐시로 옛 번들을 보는 문제 방지
        # (해시 자산 js/css는 아래 regex location에서 1년 immutable 적용)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}